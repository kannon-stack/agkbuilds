# Talaria desktop app (hermes-desktop/): test on every change, build installers for all three platforms,
# and publish a DRAFT GitHub release when a tag like `desktop-v0.2.0` is pushed.
#
# Optional signing secrets (builds are unsigned without them):
#   macOS:   CSC_LINK (base64 .p12 Developer ID cert), CSC_KEY_PASSWORD,
#            and for notarization APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER (or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID)
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
name: Talaria desktop

on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      - 'hermes-desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'hermes-desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hermes-desktop

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:bundle

  e2e:
    name: End-to-end (real app, fake providers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      # Electron needs a display; xvfb-run provides a virtual one.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a node tests/e2e/run.cjs
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    needs: [test, e2e]
    # Installers are only built for tags and manual runs; regular pushes/PRs stop after `test`.
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-desktop/package-lock.json
      - run: npm ci
      # One step per OS so each platform only ever sees its own signing secrets.
      - name: Build installers (Linux)
        if: runner.os == 'Linux'
        run: npm run dist
      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build installers (Windows)
        if: runner.os == 'Windows'
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: talaria-${{ matrix.os }}
          if-no-files-found: error
          path: |
            hermes-desktop/release/*.exe
            hermes-desktop/release/*.dmg
            hermes-desktop/release/*.zip
            hermes-desktop/release/*.AppImage
            hermes-desktop/release/*.deb
            hermes-desktop/release/*.tar.gz

  release:
    name: Draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: talaria-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
