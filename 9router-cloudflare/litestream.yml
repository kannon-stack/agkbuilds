# Env vars are expanded by Litestream: DATA_DIR, R2_ACCOUNT_ID, R2_BUCKET,
# LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY (set by src/index.ts).
dbs:
  - path: ${DATA_DIR}/db/data.sqlite
    replicas:
      - type: s3
        bucket: ${R2_BUCKET}
        path: 9router/db
        endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
        region: auto
        force-path-style: true
        sync-interval: 5s
        snapshot-interval: 6h
        retention: 72h
